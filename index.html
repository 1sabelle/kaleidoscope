<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=Instrument+Serif:ital@0;1&display=swap"
    />
    <title>Kaleidoscope</title>
    <script>
      // Apply the saved theme and custom background before first paint, as
      // applyAppearance() in src/theme.ts does (same luminance test as isLight()).
      try {
        const root = document.documentElement;
        const theme = localStorage.getItem("kaleidoscope:theme");
        if (theme === "light" || theme === "dark") root.dataset.theme = theme;
        const colours = JSON.parse(localStorage.getItem("kaleidoscope:colours") || "{}");
        const isLight = (hex) => {
          const [r, g, b] = [1, 3, 5].map((i) => {
            const c = parseInt(hex.slice(i, i + 2), 16) / 255;
            return c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4;
          });
          return 0.2126 * r + 0.7152 * g + 0.0722 * b > 0.179;
        };
        const hex = colours.background;
        if (/^#[0-9a-f]{6}$/.test(hex)) {
          root.style.setProperty("--bg", hex);
          root.dataset.ink = isLight(hex) ? "dark" : "light";
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
